<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Autobahn</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  :root {
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { background: #050505; color: #DEDEDE; font: 15px/1.5 var(--sans); font-synthesis: none; }
  .wrap { width: 100%; padding: 0 28px 96px; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 28px 0 8px; }
  header h1 { font-size: 30px; font-weight: 400; letter-spacing: -0.015em; }
  header .root { font-size: 13px; color: #3B3D3D; }
  header .dirty { font-size: 13px; color: #969A9C; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 0 22px; }
  nav button { font: 13.5px var(--sans); color: #969A9C; background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  nav button:hover { color: #DEDEDE; }
  nav button.on { background: #1E2020; color: #DEDEDE; }

  .pins { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 3px; margin-bottom: 28px; }
  .pin { background: #111212; padding: 16px 18px; }
  .pin h3 { font-size: 14.5px; font-weight: 400; color: #969A9C; margin-bottom: 8px; }
  .pin pre { font: 13px/1.55 var(--sans); color: #969A9C; white-space: pre-wrap; max-height: 130px; overflow: auto; }
  .pin strong { font-weight: 400; color: #DEDEDE; }
  .pin code { font-family: var(--mono); font-size: 11.5px; background: #1a1b1b; border-radius: 4px; padding: 0 5px; }
  .pin a { color: #DEDEDE; }

  .lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; align-items: start; }
  @media (max-width: 980px) { .lanes { grid-template-columns: 1fr; } }
  .lane { background: #0A0B0B; min-height: 320px; padding: 14px; }
  .lane.over { outline: 1px solid rgba(255,255,255,0.18); outline-offset: -1px; }
  .lane > h2 { font-size: 18px; font-weight: 400; color: #DEDEDE; padding: 2px 4px 12px; display: flex; justify-content: space-between; }
  .lane > h2 .n { color: #3B3D3D; font-feature-settings: 'pnum' 1, 'zero' 1; }
  .card { background: #111212; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: grab; }
  .card:active { cursor: grabbing; }
  .card:hover { background: #161717; }
  .card.over-before { box-shadow: 0 -2px 0 0 #DEDEDE; }
  .card .id { display: inline-block; font-size: 11.5px; color: #969A9C; background: #1a1b1b; border-radius: 6px; padding: 1.5px 7px; margin-bottom: 7px; }
  .card .id.blocked { color: #DEDEDE; }
  .card .meta-chips { display: inline-flex; gap: 4px; margin-left: 4px; }
  .card .chip { font-size: 11px; color: #6f7375; background: #161717; border-radius: 6px; padding: 1.5px 7px; }
  .card h4 { font-size: 15.5px; font-weight: 400; line-height: 1.4; text-wrap: pretty; }
  .card .st { margin-top: 7px; font-size: 13px; color: #969A9C; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.done { opacity: 0.55; cursor: default; }
  .card.done h4 { color: #969A9C; }
  .newcard { margin-left: auto; font: 13.5px var(--sans); color: #050505; background: #DEDEDE; border: 0; border-radius: 999px; padding: 7px 15px; cursor: pointer; }
  .newcard:hover { background: #fff; }

  .doc { max-width: 920px; font-size: 15px; line-height: 1.65; color: #C9CDCF; }
  .doc h1 { font-size: 36px; font-weight: 400; letter-spacing: -0.015em; color: #DEDEDE; margin: 8px 0 14px; }
  .doc h2 { font-size: 24px; font-weight: 400; color: #DEDEDE; margin: 30px 0 10px; }
  .doc h3, .doc h4 { font-size: 17px; font-weight: 400; color: #DEDEDE; margin: 22px 0 8px; }
  .doc p { margin: 0 0 12px; text-wrap: pretty; }
  .doc ul, .doc ol { margin: 0 0 12px; padding-left: 22px; }
  .doc li { margin: 3px 0; }
  .doc strong { font-weight: 400; color: #DEDEDE; }
  .doc em { font-style: normal; color: #DEDEDE; }
  .doc code { font-family: var(--mono); font-size: 12.5px; background: #111212; border-radius: 4px; padding: 1.5px 6px; color: #C9CDCF; }
  .doc pre.code { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; background: #0A0B0B; padding: 14px 16px; margin: 0 0 14px; overflow-x: auto; white-space: pre; color: #A9ADAF; }
  .doc pre.code code { background: none; padding: 0; }
  .doc a { color: #DEDEDE; text-decoration: underline; text-underline-offset: 2px; }
  .doc hr { border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 24px 0; }
  .doc blockquote { border-left: 2px solid #3B3D3D; margin: 0 0 12px; padding: 2px 0 2px 14px; color: #969A9C; }
  .doc table { border-collapse: collapse; margin: 0 0 14px; font-size: 13.5px; }
  .doc th, .doc td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: top; }
  .doc th { color: #969A9C; font-weight: 400; }
  .hint { margin-top: 40px; font-size: 13px; color: #3B3D3D; }

  .lb-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: flex-start; justify-content: center; padding: 8vh 24px 24px; z-index: 100; overflow-y: auto; }
  .lb-backdrop.open { display: flex; }
  .lb-panel { background: #111212; border-radius: 14px; max-width: 780px; width: 100%; padding: 26px 30px 30px; position: relative; }
  .lb-head { display: flex; align-items: baseline; gap: 12px; padding-right: 40px; margin-bottom: 6px; }
  .lb-head .id { font-size: 12px; color: #969A9C; background: #1a1b1b; border-radius: 6px; padding: 2px 8px; }
  .lb-head h2 { font-size: 19px; font-weight: 400; line-height: 1.35; color: #DEDEDE; text-wrap: pretty; }
  .lb-lane { font-size: 13px; color: #3B3D3D; margin-bottom: 16px; }
  .lb-close { position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border: 0; border-radius: 999px; background: #1a1b1b; color: #969A9C; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .lb-close:hover { color: #DEDEDE; }
  .lb-body { font-size: 14.5px; line-height: 1.6; color: #C9CDCF; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Autobahn</h1>
    <span class="root" id="root"></span>
    <span class="dirty" id="dirty"></span>
    <button type="button" class="newcard" onclick="newCard()">New card</button>
  </header>
  <nav id="tabs"></nav>
  <div id="view"></div>
  <p class="hint" id="hint"></p>
</div>
<div class="lb-backdrop" id="lb" onclick="if (event.target === this) closeCard()">
  <div class="lb-panel">
    <button type="button" class="lb-close" onclick="closeCard()" aria-label="Close">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lb-head"><span class="id" id="lb-id"></span><h2 id="lb-title"></h2></div>
    <div class="lb-lane" id="lb-lane"></div>
    <div class="lb-body doc" id="lb-body"></div>
  </div>
</div>
<script>
let state = null, tab = 'Board', LANES = []

async function load() {
  state = await (await fetch('/api/board')).json()
  LANES = [...state.lanes, 'Shipped']
  document.getElementById('root').textContent = state.root
  document.getElementById('hint').textContent =
    `Cards are the ## PREFIX-N blocks in ${state.backlog} (grammar: FORMAT.md). ` +
    'Drag between lanes or onto a card to reorder — both rewrite the file. ' +
    'New card mints the next number. Click a card for full detail. Commit as usual.'
  renderTabs()
  render()
}

function renderTabs() {
  const tabs = ['Board', state.backlog, ...state.docs]
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    `<button class="${t === tab ? 'on' : ''}" onclick="setTab('${t}')">${deshout(t.replace('.md',''))}</button>`).join('')
  document.getElementById('dirty').textContent = state.dirty ? 'uncommitted changes' : ''
}
function setTab(t) { tab = t; renderTabs(); render() }

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;') }

// Never all uppercase (the house rule). ALL-CAPS words render Title Case,
// except card ids (PREFIX-123) and real acronyms, which stay themselves.
const ACRONYMS = new Set(['PR','PRS','E2E','AA','AAA','OG','API','CLI','SEO','UI','UX','FAQ','SDK','URL','URLS','CI','CD','WCAG','AI','A11Y','CSS','HTML','JS','TS','ID','IDS','DDL','SQL','DB','HTTP','HTTPS','UTM','AM','PM','KPI','SAAS','QA','TLDR','CTA','CTAS','MVP','SLA','ROI','JSON','YAML','MD','MCP','NPM','OSS','CSV','PDF','XML','PNG','JPG','GIF','SVG','REST','GRPC','GPU','CPU','RAM','LLM','IP','TCP','DNS','TLS','SSH','JWT','OAUTH','CRUD','ORM','CDN','SSR','SPA','SEO'])
// Emphasis caps (NOT, NEVER, ...) read best lowercased mid-sentence.
const EMPHASIS = new Set(['NOT','NEVER','ALWAYS','ONLY','ALL','MUST','DO','DONT','THE','AND','OR','NO','YES','EVERY'])
function deshout(s) {
  return s.replace(/\b[A-Z][A-Z0-9'-]{1,}\b/g, (w, off) => {
    if (/^[A-Z][A-Z0-9]*-\d+$/.test(w)) return w
    const bare = w.replace(/[^A-Z0-9]/g, '')
    if (ACRONYMS.has(bare)) return w
    if (EMPHASIS.has(bare)) {
      const atStart = off === 0 || /[.!?:]\s+$|^[-*\d.\s]*$/.test(s.slice(Math.max(0, off - 3), off))
      const low = w.toLowerCase()
      return atStart ? low.charAt(0).toUpperCase() + low.slice(1) : low
    }
    return w.split('-').map(p => ACRONYMS.has(p) ? p : p.charAt(0) + p.slice(1).toLowerCase()).join('-')
  })
}

// A small markdown renderer: headings, lists, bold/italic/code, links,
// fences, tables, blockquotes, rules. Trusted local files only.
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
}
function md(src) {
  const out = []
  const lines = src.split('\n')
  let i = 0, list = null
  const closeList = () => { if (list) { out.push(list === 'ul' ? '</ul>' : '</ol>'); list = null } }
  // A line that STARTS a block (vs. a hard-wrapped continuation of the
  // previous paragraph or list item — many md sources wrap at ~72 cols).
  const isBlockStart = (l) => /^(#{1,4} |```|---\s*$|\*\*\*\s*$|\s*[-*] |\s*\d+\. |> |\|)/.test(l) || l.trim() === ''
  // Absorb hard-wrapped continuation lines into one flowing string.
  const absorb = (first) => {
    let text = first
    while (i + 1 < lines.length && !isBlockStart(lines[i + 1])) { i++; text += ' ' + lines[i].trim() }
    return text
  }
  while (i < lines.length) {
    const l = lines[i]
    if (/^```/.test(l)) { // fence: verbatim, no deshout, no rewrap
      closeList()
      const buf = []
      i++
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++])
      i++
      out.push('<pre class="code">' + esc(buf.join('\n')) + '</pre>')
      continue
    }
    const t = deshout(l)
    let m
    if ((m = t.match(/^(#{1,4}) (.*)$/))) { closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`) }
    else if (/^(---|\*\*\*)\s*$/.test(t)) { closeList(); out.push('<hr/>') }
    else if ((m = t.match(/^\s*[-*] (.*)$/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul' } out.push('<li>' + inline(deshout(absorb(m[1]))) + '</li>') }
    else if ((m = t.match(/^\s*\d+\. (.*)$/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol' } out.push('<li>' + inline(deshout(absorb(m[1]))) + '</li>') }
    else if ((m = t.match(/^> ?(.*)$/))) { closeList(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>') }
    else if (/^\|/.test(t)) { // table run
      closeList()
      const rows = []
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(deshout(lines[i])); i++ }
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()))
      const body = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r))
      const [head, ...rest] = body
      out.push('<table><tr>' + cells(head).map(c => `<th>${c}</th>`).join('') + '</tr>' +
        rest.map(r => '<tr>' + cells(r).map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>')
      continue
    }
    else if (t.trim() === '') { closeList() }
    else { closeList(); out.push('<p>' + inline(deshout(absorb(l))) + '</p>') }
    i++
  }
  closeList()
  return out.join('\n')
}

async function render() {
  const view = document.getElementById('view')
  if (tab !== 'Board') {
    const src = await (await fetch('/api/doc?name=' + encodeURIComponent(tab))).text()
    view.innerHTML = '<div class="doc">' + md(src) + '</div>'
    return
  }
  const pins = state.pinned.map(p =>
    `<div class="pin"><h3>${inline(deshout(p.title))}</h3><pre>${inline(deshout(p.body.slice(0, 900)))}</pre></div>`).join('')
  const lanes = LANES.map(lane => {
    const items = state.items.filter(i => lane === 'Shipped' ? i.done : (i.lane === lane && !i.done))
    const cards = items.map(i => `
      <div class="card ${i.done ? 'done' : ''}" draggable="${!i.done}" data-id="${i.id}" onclick="openCard('${i.id}')" style="cursor: pointer">
        <span class="id ${i.blocked ? 'blocked' : ''}">${i.id}${i.blocked ? ' · Blocked' : ''}</span><span class="meta-chips">${chipVal(i.size) ? `<span class="chip">${esc(chipVal(i.size))}</span>` : ''}${chipVal(i.tags) ? `<span class="chip">${esc(chipVal(i.tags))}</span>` : ''}</span>
        <h4>${esc(deshout(i.title))}</h4>
        ${i.status ? `<div class="st">${esc(deshout(i.status))}</div>` : ''}
      </div>`).join('')
    return `<div class="lane" data-lane="${lane}"><h2>${lane} <span class="n">${items.length}</span></h2>${cards}</div>`
  }).join('')
  view.innerHTML = (pins ? `<div class="pins">${pins}</div>` : '') + `<div class="lanes">${lanes}</div>`
  wireDnd()
}

// Chip values: first token (drop parentheticals), hidden when tbd/none.
function chipVal(v) {
  if (!v) return null
  const t = v.split('(')[0].trim().split(/\s+—/)[0].trim()
  if (!t || /^(tbd|none|n\/a)$/i.test(t)) return null
  return t.length > 18 ? t.slice(0, 17) + '…' : t
}

async function newCard() {
  const lane = state.lanes[1] || state.lanes[0]
  const title = prompt(`New card title (goes to ${lane}):`)
  if (!title || !title.trim()) return
  const r = await fetch('/api/new', { method: 'POST', body: JSON.stringify({ title: title.trim(), lane }) })
  const d = await r.json()
  if (!r.ok) { alert('failed: ' + (d.error || r.status)); return }
  await load()
  openCard(d.id)
}

let dragged = false
function openCard(id) {
  if (dragged) { dragged = false; return }
  const item = state.items.find(i => i.id === id)
  if (!item) return
  document.getElementById('lb-id').textContent = item.id
  document.getElementById('lb-title').innerHTML = inline(deshout(item.title))
  document.getElementById('lb-lane').textContent = (item.done ? 'Shipped · filed in ' : '') + item.lane
  document.getElementById('lb-body').innerHTML = md(item.body || '')
  document.getElementById('lb').classList.add('open')
}
function closeCard() { document.getElementById('lb').classList.remove('open') }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard() })

function wireDnd() {
  document.querySelectorAll('.card[draggable="true"]').forEach(c => {
    c.addEventListener('dragstart', e => { dragged = true; e.dataTransfer.setData('text/plain', c.dataset.id) })
    c.addEventListener('dragend', () => setTimeout(() => { dragged = false }, 50))
  })
  // Dropping ON a card inserts before it (within-lane reordering, and
  // precise placement on cross-lane moves). Shipped is derived, no drops.
  document.querySelectorAll('.lane .card').forEach(c => {
    const lane = c.closest('.lane').dataset.lane
    if (lane === 'Shipped') return
    c.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); c.classList.add('over-before') })
    c.addEventListener('dragleave', () => c.classList.remove('over-before'))
    c.addEventListener('drop', async e => {
      e.preventDefault(); e.stopPropagation(); c.classList.remove('over-before')
      const id = e.dataTransfer.getData('text/plain')
      if (id === c.dataset.id) return
      const r = await fetch('/api/move', { method: 'POST', body: JSON.stringify({ id, toLane: lane, beforeId: c.dataset.id }) })
      if (!r.ok) alert('move failed: ' + (await r.json()).error)
      load()
    })
  })
  document.querySelectorAll('.lane').forEach(l => {
    const lane = l.dataset.lane
    if (lane === 'Shipped') return
    l.addEventListener('dragover', e => { e.preventDefault(); l.classList.add('over') })
    l.addEventListener('dragleave', () => l.classList.remove('over'))
    l.addEventListener('drop', async e => {
      e.preventDefault(); l.classList.remove('over')
      const id = e.dataTransfer.getData('text/plain')
      const r = await fetch('/api/move', { method: 'POST', body: JSON.stringify({ id, toLane: lane }) })
      if (!r.ok) alert('move failed: ' + (await r.json()).error)
      load()
    })
  })
}
load()
</script>
</body>
</html>
