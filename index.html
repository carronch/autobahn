<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kanban</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  :root {
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
  }
  body { background: #050505; color: #DEDEDE; font: 15px/1.5 var(--sans); font-synthesis: none; }
  .wrap { width: 100%; padding: 0 28px 96px; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 28px 0 8px; flex-wrap: wrap; }
  .header-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .focus-wrap { display: flex; align-items: center; gap: 8px; }
  .focus-label { font-size: 12px; color: #3B3D3D; }
  .focus-wrap select { font: 13px var(--sans); color: #DEDEDE; background: #1E2020; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; max-width: 220px; }
  .focus-wrap select:focus { outline: 1px solid #3B3D3D; }
  .filter-note { font-size: 13px; color: #969A9C; padding: 0 0 18px; }

  header h1 { font-size: 30px; font-weight: 400; letter-spacing: -0.015em; }
  header .root { font-size: 13px; color: #3B3D3D; font-family: var(--mono); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 0 22px; }
  nav button { font: 13.5px var(--sans); color: #969A9C; background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  nav button:hover { color: #DEDEDE; }
  nav button.on { background: #1E2020; color: #DEDEDE; }
  .newcard { margin-left: auto; font: 13.5px var(--sans); color: #050505; background: #DEDEDE; border: 0; border-radius: 999px; padding: 7px 15px; cursor: pointer; }
  .newcard:hover { background: #fff; }

  .lanes { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 3px; align-items: start; }
  @media (max-width: 980px) { .lanes { grid-template-columns: 1fr; } }
  .lane { background: #0A0B0B; min-height: 320px; padding: 14px; }
  .lane.over { outline: 1px solid rgba(255,255,255,0.18); outline-offset: -1px; }
  .lane > h2 { font-size: 18px; font-weight: 400; color: #DEDEDE; padding: 2px 4px 12px; display: flex; justify-content: space-between; text-transform: capitalize; }
  .lane > h2 .n { color: #3B3D3D; font-feature-settings: 'pnum' 1, 'zero' 1; }
  .card { background: #111212; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: grab; }
  .card:active { cursor: grabbing; }
  .card:hover { background: #161717; }
  .card .id { display: inline-block; font-size: 11.5px; color: #969A9C; background: #1a1b1b; border-radius: 6px; padding: 1.5px 7px; margin-bottom: 7px; font-family: var(--mono); }
  .card .meta-chips { display: inline-flex; gap: 4px; margin-left: 4px; }
  .card .chip { font-size: 11px; color: #6f7375; background: #161717; border-radius: 6px; padding: 1.5px 7px; }
  .card .chip.warn { color: #DEDEDE; }
  .card h4 { font-size: 15.5px; font-weight: 400; line-height: 1.4; text-wrap: pretty; }
  .card .st { margin-top: 7px; font-size: 13px; color: #969A9C; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .talk { float: right; font: 11px var(--mono); color: #6f7375; background: none; border: 1px solid #242626; border-radius: 6px; padding: 2px 8px; cursor: pointer; opacity: 0; transition: opacity 0.12s; }
  .card:hover .talk { opacity: 1; }
  .card .talk:hover { color: #DEDEDE; border-color: #3B3D3D; }
  .card .talk:disabled { opacity: 0.4; cursor: wait; }
  .lb-talk { margin: 0 0 16px; font: 13px var(--mono); color: #DEDEDE; background: #1a1b1b; border: 1px solid #242626; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  .lb-talk:hover { background: #242626; }
  .lb-talk:disabled { opacity: 0.4; cursor: wait; }
  .card.done { opacity: 0.55; }
  .card.done h4 { color: #969A9C; }
  .card.hot { border-left: 3px solid #E5484D; padding-left: 11px; }
  .chip.hot { color: #FF8589; background: rgba(229,72,77,0.14); }

  .doc { max-width: 920px; font-size: 15px; line-height: 1.65; color: #C9CDCF; }
  .doc h1 { font-size: 36px; font-weight: 400; letter-spacing: -0.015em; color: #DEDEDE; margin: 8px 0 14px; }
  .doc h2 { font-size: 24px; font-weight: 400; color: #DEDEDE; margin: 30px 0 10px; }
  .doc h3, .doc h4 { font-size: 17px; font-weight: 400; color: #DEDEDE; margin: 22px 0 8px; }
  .doc p { margin: 0 0 12px; text-wrap: pretty; }
  .doc ul, .doc ol { margin: 0 0 12px; padding-left: 22px; }
  .doc li { margin: 3px 0; }
  .doc strong { font-weight: 400; color: #DEDEDE; }
  .doc em { font-style: normal; color: #DEDEDE; }
  .doc code { font-family: var(--mono); font-size: 12.5px; background: #111212; border-radius: 4px; padding: 1.5px 6px; color: #C9CDCF; }
  .doc pre.code { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; background: #0A0B0B; padding: 14px 16px; margin: 0 0 14px; overflow-x: auto; white-space: pre; color: #A9ADAF; }
  .doc pre.code code { background: none; padding: 0; }
  .doc a { color: #DEDEDE; text-decoration: underline; text-underline-offset: 2px; }
  .doc hr { border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 24px 0; }
  .doc blockquote { border-left: 2px solid #3B3D3D; margin: 0 0 12px; padding: 2px 0 2px 14px; color: #969A9C; }
  .doc table { border-collapse: collapse; margin: 0 0 14px; font-size: 13.5px; }
  .doc th, .doc td { text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); vertical-align: top; }
  .doc th { color: #969A9C; font-weight: 400; }
  .hint { margin-top: 40px; font-size: 13px; color: #3B3D3D; }

  .lb-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: flex-start; justify-content: center; padding: 8vh 24px 24px; z-index: 100; overflow-y: auto; }
  .lb-backdrop.open { display: flex; }
  .lb-panel { background: #111212; border-radius: 14px; max-width: 780px; width: 100%; padding: 26px 30px 30px; position: relative; }
  .lb-head { display: flex; align-items: baseline; gap: 12px; padding-right: 40px; margin-bottom: 6px; }
  .lb-head .id { font-size: 12px; color: #969A9C; background: #1a1b1b; border-radius: 6px; padding: 2px 8px; font-family: var(--mono); white-space: nowrap; }
  .lb-head h2 { font-size: 19px; font-weight: 400; line-height: 1.35; color: #DEDEDE; text-wrap: pretty; }
  .lb-lane { font-size: 13px; color: #3B3D3D; margin-bottom: 16px; }
  .lb-close { position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border: 0; border-radius: 999px; background: #1a1b1b; color: #969A9C; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .lb-close:hover { color: #DEDEDE; }
  .lb-body { font-size: 14.5px; line-height: 1.6; color: #C9CDCF; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kanban</h1>
    <span class="root" id="root"></span>

    <div class="header-actions">
      <label class="focus-wrap">
        <span class="focus-label">Proyecto</span>
        <select id="focus" onchange="setFocus(this.value)" aria-label="Filtrar por proyecto">
          <option value="">Todos</option>
        </select>
      </label>
      <button type="button" class="newcard" onclick="newCard()">Nueva carta</button>
    </div>
  </header>
  <nav id="tabs"></nav>
  <p class="filter-note" id="filter-note" hidden></p>
  <div id="view"></div>
  <p class="hint" id="hint"></p>
</div>
<div class="lb-backdrop" id="lb" onclick="if (event.target === this) closeCard()">
  <div class="lb-panel">
    <button type="button" class="lb-close" onclick="closeCard()" aria-label="Cerrar">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lb-head"><span class="id" id="lb-id"></span><h2 id="lb-title"></h2></div>
    <div class="lb-lane" id="lb-lane"></div>
    <button type="button" class="lb-talk" id="lb-talk">✳ Resolver con Claude</button>
    <div class="lb-body doc" id="lb-body"></div>
  </div>
</div>
<script>
let state = null, board = null, tab = null
let focus = null
if (new URLSearchParams(location.search).has('focus')) focus = new URLSearchParams(location.search).get('focus') || ''

function boardQuery() {
  const q = new URLSearchParams()
  q.set('board', board ?? '')
  if (focus !== null) q.set('focus', focus)
  return q
}

async function load() {
  state = await (await fetch('/api/board?' + boardQuery())).json()
  if (focus === null) focus = state.focus || ''
  syncFocusUrl()
  board = state.board
  if (tab === null) tab = board
  document.getElementById('root').textContent = state.root
  document.getElementById('hint').textContent =
    'Cada carta es un archivo .md — la columna es su `status:` en el frontmatter. ' +
    'Arrastrá una carta a otra columna y el archivo se reescribe (solo status + updated). ' +
    'Hacé clic en una carta para ver el plan completo. Filtra por proyecto con el selector o `?focus=my-project`.'
  renderFocusSelect()
  renderFilterNote()
  renderTabs()
  render()
}


function syncFocusUrl() {
  const url = new URL(location.href)
  if (focus === null) url.searchParams.delete('focus')
  else if (focus) url.searchParams.set('focus', focus)
  else url.searchParams.set('focus', '')
  history.replaceState(null, '', url)
}

function setFocus(value) {
  focus = value || ''
  syncFocusUrl()
  load()
}

function renderFocusSelect() {
  const sel = document.getElementById('focus')
  const opts = (state.focusOptions || []).map(o =>
    `<option value="${esc(o.slug)}"${o.slug === focus ? ' selected' : ''}>${esc(o.label)}</option>`).join('')
  sel.innerHTML = '<option value="">Todos</option>' + opts
}

function renderFilterNote() {
  const el = document.getElementById('filter-note')
  if (!focus) {
    el.hidden = true
    return
  }
  const label = (state.focusOptions || []).find(o => o.slug === focus)?.label || focus
  const shown = state.items.length
  const total = state.totalItems ?? shown
  el.textContent = `Mostrando ${shown} de ${total} cartas · ${label}`
  el.hidden = false
}

function renderTabs() {
  const TAB_LABELS = { 'next-actions.md': '🔴 Next Actions' }
  const tabs = [...state.boards, ...state.docs]
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    `<button class="${t === tab ? 'on' : ''}" onclick="setTab('${t}')">${esc(TAB_LABELS[t] ?? t.replace(/\.md$/, ''))}</button>`).join('')
}
async function setTab(t) {
  tab = t
  if (state.boards.includes(t) && t !== board) { board = t; await load(); return }
  renderTabs(); render()
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;') }

// A small markdown renderer: headings, lists, bold/italic/code, links,
// fences, tables, blockquotes, rules. Trusted local files only.
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[\[wiki\/workblocks\/([^\]|]+)\|([^\]]+)\]\]/g, (_, id, label) =>
      `<a href="#" onclick="openCard('${id}');return false">${label}</a>`)
    .replace(/\[\[([^\]]+)\]\]/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
}
function md(src) {
  const out = []
  const lines = src.split('\n')
  let i = 0, list = null
  const closeList = () => { if (list) { out.push(list === 'ul' ? '</ul>' : '</ol>'); list = null } }
  const isBlockStart = (l) => /^(#{1,4} |```|---\s*$|\*\*\*\s*$|\s*[-*] |\s*\d+\. |> |\|)/.test(l) || l.trim() === ''
  const absorb = (first) => {
    let text = first
    while (i + 1 < lines.length && !isBlockStart(lines[i + 1])) { i++; text += ' ' + lines[i].trim() }
    return text
  }
  while (i < lines.length) {
    const l = lines[i]
    if (/^```/.test(l)) {
      closeList()
      const buf = []
      i++
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++])
      i++
      out.push('<pre class="code">' + esc(buf.join('\n')) + '</pre>')
      continue
    }
    let m
    if ((m = l.match(/^(#{1,4}) (.*)$/))) { closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`) }
    else if (/^(---|\*\*\*)\s*$/.test(l)) { closeList(); out.push('<hr/>') }
    else if ((m = l.match(/^\s*[-*] (.*)$/))) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul' } out.push('<li>' + inline(absorb(m[1])) + '</li>') }
    else if ((m = l.match(/^\s*\d+\. (.*)$/))) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol' } out.push('<li>' + inline(absorb(m[1])) + '</li>') }
    else if ((m = l.match(/^> ?(.*)$/))) { closeList(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>') }
    else if (/^\|/.test(l)) {
      closeList()
      const rows = []
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++ }
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()))
      const body = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r))
      const [head, ...rest] = body
      out.push('<table><tr>' + cells(head).map(c => `<th>${c}</th>`).join('') + '</tr>' +
        rest.map(r => '<tr>' + cells(r).map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>')
      continue
    }
    else if (l.trim() === '') { closeList() }
    else { closeList(); out.push('<p>' + inline(absorb(l)) + '</p>') }
    i++
  }
  closeList()
  return out.join('\n')
}

// The chip shows the FIRST tag of the card's frontmatter `tags:`; map known project slugs to pretty labels.
const TAG_LABELS = { 'my-project': 'My Project', 'my-project-2': 'My Project 2' }

const LANE_LABELS = { 'someday-maybe': 'Someday/Maybe', 'active': 'Active', 'waiting-for': 'Waiting For', 'done': 'Done', 'considering': 'Considering' }
const laneLabel = l => LANE_LABELS[l] ?? l

async function render() {
  const view = document.getElementById('view')
  if (tab !== board) {
    const docQ = new URLSearchParams({ name: tab })
    if (focus !== null && focus) docQ.set('focus', focus)
    const src = await (await fetch('/api/doc?' + docQ)).text()
    view.innerHTML = '<div class="doc">' + md(src) + '</div>'
    return
  }
  const last = state.lanes[state.lanes.length - 1]
  const lanes = state.lanes.map(lane => {
    const items = state.items.filter(i => i.lane === lane)
      .sort((a, b) => (b.priority === 'high') - (a.priority === 'high'))
    const cards = items.map(i => `
      <div class="card ${lane === last ? 'done' : ''} ${i.priority === 'high' ? 'hot' : ''}" draggable="true" data-id="${esc(i.id)}" onclick="openCard('${esc(i.id)}')">
        <button type="button" class="talk" title="Abrir una terminal con Claude sobre esta carta" onclick="talk(event, '${esc(i.id)}')">✳ claude</button>
        <span class="id">${esc(i.date ?? i.id)}</span><span class="meta-chips">${i.priority === 'high' ? '<span class="chip hot">🔥 alta</span>' : ''}${i.tags ? `<span class="chip">${esc(TAG_LABELS[i.tags] ?? i.tags)}</span>` : ''}${i.unmapped ? `<span class="chip warn">status: ${esc(i.unmapped)}</span>` : ''}</span>
        <h4>${esc(i.title)}</h4>
        ${i.note ? `<div class="st">${esc(i.note)}</div>` : ''}
      </div>`).join('')
    return `<div class="lane" data-lane="${lane}"><h2>${laneLabel(lane)} <span class="n">${items.length}</span></h2>${cards}</div>`
  }).join('')
  view.innerHTML = `<div class="lanes" style="--n:${state.lanes.length}">${lanes}</div>`
  wireDnd()
}

async function newCard() {
  const lane = state.lanes[0]
  const title = prompt(`Título de la nueva carta (entra en «${laneLabel(lane)}» de ${board}):`)
  if (!title || !title.trim()) return
  const r = await fetch('/api/new', { method: 'POST', body: JSON.stringify({ board, title: title.trim(), lane }) })
  const d = await r.json()
  if (!r.ok) { alert('falló: ' + (d.error || r.status)); return }
  await load()
  openCard(d.id)
}

async function talk(ev, id) {
  ev.stopPropagation()
  const btn = ev.currentTarget
  btn.disabled = true
  try {
    const r = await fetch('/api/claude', { method: 'POST', body: JSON.stringify({ board, id }) })
    if (!r.ok) alert('no pude abrir la terminal: ' + ((await r.json()).error || r.status))
  } finally { btn.disabled = false }
}

let dragged = false
function openCard(id) {
  if (dragged) { dragged = false; return }
  const item = state.items.find(i => i.id === id)
  if (!item) return
  document.getElementById('lb-id').textContent = item.id + '.md'
  document.getElementById('lb-title').innerHTML = inline(item.title)
  document.getElementById('lb-lane').textContent = item.lane + (item.updated ? ' · updated ' + item.updated : '')
  document.getElementById('lb-body').innerHTML = md(item.body || '')
  document.getElementById('lb-talk').onclick = (e) => talk(e, item.id)
  document.getElementById('lb').classList.add('open')
}
function closeCard() { document.getElementById('lb').classList.remove('open') }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard() })

// Dropping anywhere in a lane sets the card's status — order inside a lane
// is by date, so there's no manual reordering to preserve.
function wireDnd() {
  document.querySelectorAll('.card').forEach(c => {
    c.addEventListener('dragstart', e => { dragged = true; e.dataTransfer.setData('text/plain', c.dataset.id) })
    c.addEventListener('dragend', () => setTimeout(() => { dragged = false }, 50))
  })
  document.querySelectorAll('.lane').forEach(l => {
    const lane = l.dataset.lane
    l.addEventListener('dragover', e => { e.preventDefault(); l.classList.add('over') })
    l.addEventListener('dragleave', () => l.classList.remove('over'))
    l.addEventListener('drop', async e => {
      e.preventDefault(); l.classList.remove('over')
      const id = e.dataTransfer.getData('text/plain')
      const r = await fetch('/api/move', { method: 'POST', body: JSON.stringify({ board, id, toLane: lane }) })
      if (!r.ok) alert('falló el movimiento: ' + (await r.json()).error)
      load()
    })
  })
}
load()
</script>
</body>
</html>
